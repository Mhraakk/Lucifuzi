<!doctype html>
<!-- spec 0051 «تابلوی زنده»: the live price and market, then the market's own words at the desk, in 35 s. A sarrafi LED
     board rolls to forgod's real prices of 4 Aban 1405, 16:48 Tehran; the board becomes the app's own market page; one
     request brings the whole market, checked before it is kept; the currency wall hands the euro to the trade desk; the
     day's 50 requests go round a 24-hour dial; the analysis works again on the same prices; then a sentence in the
     market's words is typed, read and booked. Cut on Mozart: the finale of Symphony No. 40 (K. 550), whose two-bar
     phrases, the piano rocket and the forte answer in turn, warp-music.py lays one per film bar at 128 BPM. Every
     number comes from live-data.json: forgod's answer read by the app's own code, and what the app showed and booked.
     window.seek(t) draws the frame at t; nothing runs on its own clock. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<title>بئاتریس — تابلوی زنده</title>
<style>

<script type="module">
import { prog, ease, lerp, clamp01, fa, css, rng, $, $$, words, readTime } from './kit.mjs';
import { crownSvg } from '/js/crown.mjs';

const D = await fetch('./live-data.json').then((r) => r.json());
/* ---------------- the grid: 128 BPM, one film bar per two-bar phrase of K. 550's finale (its attack on the bar line) ---------------- */
const BPM = 128, BAR = 240 / BPM, BEAT = BAR / 4;
const b = (n) => n * BAR;
window.DUR = 35;
const E = { ...ease, back: (x) => { const c1 = 1.15, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; } };
const P = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const money = (n) => fa(Math.round(n));
const pct = (x, d = 1) => `${x >= 0 ? '+' : '−'}${fa(Math.abs(x * 100), { dec: d })}٪`;
const hhmm = P(D.source.tehran);
const [jy, jm, jd] = D.source.jalali;
const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const dayFa = `${P(jd)} ${MONTHS[jm - 1]} ${P(jy)}`;
const show = (el, a) => {
  el.style.visibility = a > 0.001 ? 'visible' : 'hidden';
  el.style.opacity = Math.min(1, Math.max(0, a)).toFixed(3);
};
const win = (t, t0, t1, din = 0.3, dout = 0.3, ei = ease.out, eo = ease.in) => (t < t0 || t > t1 ? 0 : Math.min(prog(t, t0, t0 + din, ei), 1 - prog(t, t1 - dout, t1, eo)));
/** a camera over a 1920 × 1080 world: keys [{t, x, y, s}] eased between, applied as translate + scale */
function cam(el, t, keys, e = E.expoInOut) {
  let a = keys[0], z = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i].t && t <= keys[i + 1].t) (a = keys[i]), (z = keys[i + 1]);
  const k = t <= keys[0].t ? 0 : t >= keys[keys.length - 1].t ? 1 : (a.e ?? e)(clamp01((t - a.t) / Math.max(1e-6, z.t - a.t)));
  const x = lerp(a.x, z.x, k), y = lerp(a.y, z.y, k), s = lerp(a.s, z.s, k);
  css(el, { transform: `translate(${(960 - x * s).toFixed(2)}px, ${(540 - y * s).toFixed(2)}px) scale(${s.toFixed(5)})` });
  return { x, y, s };
}

/* ---------------- rolling digits (an odometer: the digit strip turns, eases past its mark, settles) ---------------- */
const DIG = '۰۱۲۳۴۵۶۷۸۹';
function digitsInto(host, text, { h, w, fs, sw, seed }) {
  const r = rng(seed);
  host.style.setProperty('--h', `${h}px`);
  host.style.setProperty('--w', `${w}px`);
  host.style.setProperty('--fs', `${fs}px`);
  host.style.setProperty('--sw', `${sw}px`);
  const cells = [];
  for (const ch of text) {
    const d = DIG.indexOf(ch);
    if (d < 0) {
      const s = document.createElement('span');
      s.className = ch === '٬' || ch === '٫' ? 'sep' : 'sym';
      s.textContent = ch;
      host.append(s);
      continue;
    }
    const c = document.createElement('span');
    c.className = 'cell';
    c.innerHTML = `<span class="strip">${[...DIG, DIG[0]].map((x) => `<span>${x}</span>`).join('')}</span>`;
    host.append(c);
    cells.push({ strip: c.firstChild, d, from: Math.floor(r() * 10), turns: 1 + Math.floor(r() * 2), h });
  }
  return cells;
}
/** every cell of a number between t0 and its own landing; landings spread right (last digit) to left, or as given */
function roll(cells, t, { t0, t1, spread = 0.35, order = 'rtl', blur = true }) {
  const n = cells.length;
  cells.forEach((c, i) => {
    const rank = order === 'rtl' ? n - 1 - i : i;
    const land = t1 - spread * (rank / Math.max(1, n - 1));
    const at = (x) => {
      const k = prog(x, t0, land, E.back);
      const total = c.turns * 10 + ((c.d - c.from + 10) % 10);
      return c.from + total * k;
    };
    const pos = at(t);
    const idx = ((pos % 10) + 10) % 10;
    c.strip.style.transform = `translateY(${(-idx * c.h).toFixed(2)}px)`;
    if (blur) {
      const v = Math.abs(at(t) - at(t - 1 / 120)) * 120; // digits per second
      const lvl = v < 4 ? 0 : v < 9 ? 1 : v < 15 ? 2 : v < 22 ? 3 : v < 30 ? 4 : v < 40 ? 5 : 6;
      c.strip.style.filter = lvl ? `url(#vb${lvl})` : 'none';
    }
  });
}

];

});

/* ---------------- S3: the app's market page ---------------- */
const BX = D.desk && (await fetch('./live-app.json').then((r) => r.json())).boxes;
const MK = { x: 160, y: 70, w: 1600, h: 900 }, K = MK.w / 1920;
css($('#mk'), { left: `${MK.x}px`, top: `${MK.y}px`, width: `${MK.w}px`, height: `${MK.h}px` });
const ringAt = (host, bx, pad = 8, k = K) => {

  host.append(r);
  return r;
};
const r18 = ringAt($('#mk'), BX['market-top'].geram18), rBtc = ringAt($('#mk'), BX['market-top'].btc), rFx = ringAt($('#mk'), BX['market-top'].fx, 10);

/* ---------------- S4–S5: one request, the check ---------------- */
const FG = { x: 1440, y: 330 }, APP = { x: 470, y: 330 };
$('#nApp').innerHTML = `${crownSvg({ size: 64, ring: false, id: 'na' })}<span>بئاتریس</span>`;
const rail = $('#rail');
rail.innerHTML = `<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#e2b85a" stop-opacity="0" /><stop offset=".55" stop-color="#e2b85a" /><stop offset="1" stop-color="#fff3cf" /></linearGradient></defs>
  <path id="rl" d="M ${FG.x - 190} ${FG.y} L ${APP.x + 170} ${APP.y}" stroke="#d9cdb4" stroke-width="4" fill="none" stroke-linecap="round" />
  <path id="rq" d="M ${APP.x + 170} ${APP.y} L ${FG.x - 190} ${FG.y}" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round" />
  <path id="ra" d="M ${FG.x - 190} ${FG.y} L ${APP.x + 170} ${APP.y}" stroke="url(#gl)" stroke-width="12" fill="none" stroke-linecap="round" />
  ${[0, 1, 2, 3].map((i) => `<path class="fan" d="" stroke="#e2b85a" stroke-width="5" fill="none" stroke-linecap="round" />`).join('')}`;
const RL = Math.hypot(FG.x - 190 - (APP.x + 170), 0);
const SECS = [
  { n: D.source.sections.currencies, l: 'ارز', x: 1335 },
  { n: D.source.sections.gold, l: 'طلا و سکه', x: 955 },
  { n: D.source.sections.bubbles, l: 'حباب سکه', x: 575 },
  { n: D.source.sections.crypto, l: 'رمزارز', x: 195 },
];
SECS.forEach((s) => {

  s.el.className = 'sec';
  css(s.el, { left: `${s.x}px`, top: '560px' });
  s.el.innerHTML = `<b class="num">${fa(s.n)}</b><span>${s.l}</span>`;
  $('#secs').append(s.el);
});
const ROWS_TOTAL = SECS.reduce((a, s) => a + s.n, 0);
$('#rows').innerHTML = `یک درخواست · <span class="ltr">/api/all</span> · ${fa(ROWS_TOTAL)} ردیف`;
css($('#rows'), { left: '0', right: '0', top: `${FG.y - 92}px`, 'text-align': 'center' });
// the check: the 18k gram against ounce × dollar, as forgod's answer is read (spec 0049)
const OPS = [
  { v: fa(B.ons, { dec: 2 }), l: 'انس (دلار)' },
  { x: '÷' },
  { v: '۳۱٫۱۰۳۵', l: 'گرم در هر انس' },
  { x: '×' },
  { v: '۰٫۷۵', l: 'عیار ۱۸' },
  { x: '×' },
  { v: fa(B.usd), l: 'دلار (تومان)' },
];
$('#eq').innerHTML = OPS.map((o) => (o.x ? `<div class="x">${o.x}</div>` : `<div class="op"><b class="num">${o.v}</b><small>${o.l}</small></div>`)).join('');

$('#gauge .val').textContent = `${pct(D.check.gap)} فاصله`;

/* ---------------- S6: the currency wall ---------------- */
const TW = 312, TH = 122, GX = 18, GY = 18, WX = 1920 - 144 - TW, WY = 132; // the first tile at the top right

});

/* ---------------- S7: the desk, and the euro flying into its rate field ---------------- */
const DK = { x: 120, y: 48, w: 1680, h: 945 }, KD = DK.w / 1920;

/* ---------------- S8: the dial of the day's requests ---------------- */
const DC = { x: 1340, y: 470, r: 330 };
const ang = (min) => (min / 1440) * Math.PI * 2 - Math.PI / 2; // midnight at the top, clockwise
const pt = (min, r) => [DC.x + Math.cos(ang(min)) * r, DC.y + Math.sin(ang(min)) * r];
{
  const arc = (m0, m1, r) => {
    const [x0, y0] = pt(m0, r), [x1, y1] = pt(m1, r);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${m1 - m0 > 720 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  const hours = Array.from({ length: 24 }, (_, h) => {
    const [x0, y0] = pt(h * 60, DC.r + 18), [x1, y1] = pt(h * 60, DC.r + (h % 6 ? 30 : 42));

  }).join('');

  }).join('');

  css($('#dialC'), { left: `${DC.x - 200}px`, top: `${DC.y - 40}px`, width: '400px' });
}

/* ---------------- S9: the analysis on the same prices ---------------- */
const A = D.analysis;
$('#tagA span').innerHTML = `${crownSvg({ size: 34, ring: false, id: 'ta' })}<span>بر پایه قیمت زنده امروز (forgod، ساعت ${hhmm})</span>`;

});
$('#links').innerHTML = CARDS.map((_, i) => `<path class="lk" d="M 1160 ${370} C 1080 ${370}, 1060 ${354 + i * 196}, 975 ${354 + i * 196}" stroke="#e2b85a" stroke-width="4" fill="none" stroke-linecap="round" />`).join('');

/* ---------------- S10–S11: the market's words ---------------- */
const LINE = D.line;
const faText = (t) => P(String(t).replace(/(\d)\.(\d)/g, '$1٫$2'));
const ROLE = { offset: 'فاصله از مظنه', commit: 'ثبت', mode: 'نوع', party: 'مشتری', kind: 'کالا', coin: 'سکه', weight: 'وزن', fineness: 'عیار', price: 'قیمت', pay: 'پرداخت' };
const PARTS = LINE.parts.map((p) => ({ ...p, fa: faText(p.text) }));
// the sentence as typed: its words, in order, each belonging to one part
const typed = faText(LINE.text).split(' ');
$('#bar .txt').innerHTML = `${typed.map((w) => `<span class="tw">${w}&nbsp;</span>`).join('')}<span class="caret"></span>`;
// the word of the typed sentence each part ends on (the parts come in the sentence's order)
const PART_END = [];
{
  let cur = 0;
  for (const p of PARTS) {
    const last = p.fa.split(' ').at(-1);
    let j = typed.indexOf(last, cur);
    if (j < 0) j = Math.min(typed.length - 1, cur);
    PART_END.push(j);
    cur = j + 1;
  }
}

/* ---------------- the rail of lines (each held for its reading time) ---------------- */
const CAPS = [
  { t0: 0.3, t1: b(3) - 0.12, html: 'قیمت زنده‌ی بازار، حالا <em>در بئاتریس</em>' },

];

$('#src span').innerHTML = `<span class="ltr">forgod.qzz.io</span> · ${dayFa} · ساعت ${hhmm}`;

/** a slow push on a whole scene between t0 and t1, about (x, y): a held frame keeps moving */
const push = (el, t, t0, t1, s1 = 1.05, x = 960, y = 520) => css(el, { 'transform-origin': `${x}px ${y}px`, transform: `scale(${lerp(1, s1, prog(t, t0, t1, ease.linear)).toFixed(5)})` });

/* ================= the frame ================= */
function frame(t) {
  /* backgrounds: the board's dark room, then paper */
  const dark = Math.max(1 - prog(t, b(2) - 0.15, b(2) + 0.25, ease.inOut), prog(t, b(6) - 0.2, b(6) + 0.15, ease.inOut) * (1 - prog(t, b(7.25), b(7.25) + 0.32, ease.inOut)) * 0.92);
  css($('#ledbg'), { opacity: dark.toFixed(3) });

  /* S1–S2: the hook rolls in on the build; the drop pulls back to the whole board */
  {
    const v = 1 - prog(t, b(2) - 0.12, b(2) + 0.22, ease.in);
    show($('#led'), v);
    if (v > 0) {
      const focus = { x: 100 + 1130, y: 64 + 100 + 186 + 93 };
      const c = cam($('#ledCam'), t, [
        { t: 0, x: focus.x, y: focus.y, s: 1.4, e: E.linear },
        { t: b(1) - 0.12, x: focus.x - 10, y: focus.y, s: 1.48 },
        { t: b(1) + 0.5, x: 960, y: 487, s: 1.0, e: E.linear },
        { t: b(2), x: 960, y: 487, s: 0.975 },
        { t: b(2) + 0.3, x: 960, y: 470, s: 0.86 },
      ]);
      const pull = prog(t, b(1) - 0.12, b(1) + 0.5, E.expoInOut);
      const speed = Math.sin(Math.PI * clamp01(pull)) * (t > b(1) - 0.12 && t < b(1) + 0.5 ? 1 : 0);
      css($('#ledCam'), { filter: speed > 0.05 ? `blur(${(speed * 5).toFixed(2)}px)` : 'none' });
      css($('#led'), { filter: `blur(${(prog(t, b(2) - 0.12, b(2) + 0.22, ease.in) * 12).toFixed(2)}px)` });
      ROWS.forEach((R, i) => {
        if (i === 1) roll(R.cells, t, { t0: -0.05, t1: 3 * BEAT, spread: 2 * BEAT });
        else {
          // a row lights only when its own roll begins: before that its module is dark, never a made-up number
          const t0 = b(1) - 0.05 + i * 0.04;
          css(R.face, { opacity: prog(t, t0 - 0.02, t0 + 0.12).toFixed(3) });
          roll(R.cells, t, { t0, t1: b(1) + (i === 0 ? 2 : i === 2 ? 3 : 2.5) * BEAT, spread: 0.5 });
        }
      });
      // the live dot breathes with the beat
      const beatPh = (t / BEAT) % 1;
      css($('#panel .hd i'), { opacity: (0.45 + 0.55 * (1 - beatPh) ** 2).toFixed(3) });
    }
  }

  /* S3: the board becomes the app's own market page */
  {
    const vin = prog(t, b(2) - 0.12, b(2) + 0.3, E.out5), vout = prog(t, b(3) - 0.28, b(3) + 0.05, ease.in);
    const v = vin * (1 - vout);
    show($('#app1'), v);
    if (v > 0) {
      const push = prog(t, b(2) + 0.1, b(3) - 0.3, E.inOut);
      // out: the camera whips to the source badge, which becomes the forgod node of the next scene
      const bd = BX['market-top'].badge;
      const bcx = MK.x + (bd.x + bd.w / 2) * K, bcy = MK.y + (bd.y + bd.h / 2) * K;
      // the lean: the board and the currency table fill the frame (their centre goes to the frame's centre)
      const lc = { x: MK.x + 912 * K, y: MK.y + 560 * K }, ls = lerp(1, 1.42, push);
      const lx = lerp(0, 960 - lc.x, push), ly = lerp(0, 520 - lc.y, push);
      // then out: the camera whips to the source badge, which becomes the forgod node of the next scene
      const bsx = lx + lc.x + (bcx - lc.x) * ls, bsy = ly + lc.y + (bcy - lc.y) * ls; // the badge on screen, before the whip
      const sOut = lerp(1, 2.0, vout), dx = lerp(0, FG.x - bsx, vout), dy = lerp(0, FG.y - bsy, vout);
      css($('#mk'), { transform: `translate(${(dx + lx).toFixed(1)}px, ${(dy + ly).toFixed(1)}px) translate(${lc.x - MK.x}px, ${lc.y - MK.y}px) scale(${(lerp(1.06, 1, vin) * ls).toFixed(4)}) translate(${-(lc.x - MK.x)}px, ${-(lc.y - MK.y)}px)`,
        filter: `blur(${((1 - vin) * 10 + vout * 8).toFixed(2)}px)` });
      css($('#app1'), { transform: vout > 0 ? `translate(${(bsx + dx)}px, ${(bsy + dy)}px) scale(${sOut.toFixed(4)}) translate(${-(bsx + dx)}px, ${-(bsy + dy)}px)` : 'none' });
      const rk = (r, at) => {
        const k = prog(t, at, at + 0.32, E.out5);
        css(r, { opacity: (k * (1 - vout)).toFixed(3), transform: `scale(${lerp(1.12, 1, k).toFixed(4)})` });
      };
      rk(r18, b(2) + 0.28);
      rk(rBtc, b(2) + 2 * BEAT);
      rk(rFx, b(2) + 3 * BEAT);
    }
  }

  /* S4–S5: one request brings the market; then the check */
  {
    const v = win(t, b(3) - 0.1, b(6) + 0.1, 0.2, 0.25);
    show($('#req'), v);
    if (v > 0) {
      const follow = prog(t, b(3), b(4.25), E.inOut), lean = prog(t, b(4.5), b(6) + 0.1, ease.linear);
      css($('#req'), { 'transform-origin': '960px 500px', transform: `translateX(${lerp(-150, 0, follow).toFixed(2)}px) scale(${(lerp(1.12, 1, follow) * lerp(1, 1.06, lean)).toFixed(5)})` });
      // the nodes: forgod lands where the badge flew; the app's crown on the left
      const nIn = prog(t, b(3) - 0.05, b(3) + 0.25, E.out5);
      const nOut = prog(t, b(4.5) - 0.15, b(4.5) + 0.2, ease.in);
      css($('#nFg'), { left: `${FG.x - 215}px`, top: `${FG.y - 52}px`, opacity: ((nIn) * (1 - nOut)).toFixed(3), transform: `scale(${lerp(0.82, 1, nIn).toFixed(4)})` });
      const aIn = prog(t, b(3) + 0.18, b(3) + 0.5, E.out5);
      css($('#nApp'), { left: `${APP.x - 190}px`, top: `${APP.y - 52}px`, opacity: (aIn * (1 - nOut)).toFixed(3), transform: `translateX(${((1 - aIn) * -40).toFixed(1)}px)` });
      // the rail draws, the request goes out (ink), the answer comes back (gold)
      const rl = $('#rl'), rq = $('#rq'), ra = $('#ra');
      const draw = prog(t, b(3) + 0.1, b(3) + 0.45, ease.inOut);
      rl.style.strokeDasharray = `${RL}`;
      rl.style.strokeDashoffset = `${(RL * (1 - draw)).toFixed(1)}`;
      rl.style.opacity = (1 - nOut).toFixed(3);
      const out = prog(t, b(3) + 0.45, b(3.5) + 0.2, E.inOut);
      rq.style.strokeDasharray = `90 ${RL}`;
      rq.style.strokeDashoffset = `${(90 - (RL + 90) * out).toFixed(1)}`;
      rq.style.opacity = out > 0 && out < 1 ? 1 : 0;
      const back = prog(t, b(3.5) + 0.22, b(3.5) + 0.7, E.inOut);
      const hit = prog(t, b(3.5) + 0.18, b(3.5) + 0.62, E.out5);
      css($('#nFg'), { 'box-shadow': hit > 0 && hit < 1 ? `0 0 0 ${(hit * 26).toFixed(1)}px rgba(226, 184, 90, ${(0.45 * (1 - hit)).toFixed(3)}), 0 20px 40px -24px rgba(40, 30, 10, 0.5)` : '0 20px 40px -24px rgba(40, 30, 10, 0.5)' });
      ra.style.strokeDasharray = `${RL * 0.6} ${RL * 2}`;
      ra.style.strokeDashoffset = `${(RL * 0.6 - (RL * 1.6) * back).toFixed(1)}`;
      ra.style.opacity = (back > 0 && back < 1 ? 1 : 0).toString();
      const rowsK = win(t, b(3) + 0.5, b(4.5) - 0.1, 0.3, 0.2);
      css($('#rows'), { opacity: rowsK.toFixed(3), transform: `translateY(${((1 - prog(t, b(3) + 0.5, b(3) + 0.8, E.out5)) * 14).toFixed(1)}px)` });
      // four rails fan from the crown to the four parts of the answer, each landing on a beat
      const fans = $$('#rail .fan');
      SECS.forEach((s, i) => {
        const at = b(4) + i * BEAT * 0.5 - 0.1;
        const k = prog(t, at, at + 0.3, E.out5);
        const sx = APP.x, sy = APP.y + 52, ex = s.x + 165, ey = 560;
        const d = `M ${sx} ${sy} C ${sx} ${sy + 140}, ${ex} ${ey - 160}, ${ex} ${ey}`;
        fans[i].setAttribute('d', d);
        const L = fans[i].getTotalLength();
        fans[i].style.strokeDasharray = `${L}`;
        fans[i].style.strokeDashoffset = `${(L * (1 - prog(t, at - 0.15, at + 0.12, ease.inOut))).toFixed(1)}`;
        fans[i].style.opacity = (1 - nOut).toFixed(3);
        const so = prog(t, b(4.5) - 0.2 + i * 0.03, b(4.5) + 0.12 + i * 0.03, ease.in);
        const ghost = prog(t, b(3) + 0.35 + i * 0.06, b(3) + 0.7 + i * 0.06, E.out5);
        css(s.el, { opacity: (Math.max(ghost * 0.55, k) * (1 - so)).toFixed(3), transform: `translateY(${((1 - ghost) * 30 + so * 60).toFixed(1)}px) scale(${lerp(0.96, 1, k).toFixed(4)})`, filter: `blur(${((1 - ghost) * 6 + so * 8).toFixed(2)}px)`,
          'border-style': k > 0.05 ? 'solid' : 'dashed', 'border-color': k > 0.05 ? '#e6cf9b' : '#d9cdb4', 'box-shadow': k > 0.05 ? '0 30px 60px -34px rgba(40, 30, 10, 0.55)' : 'none' });
        const bnum = s.el.querySelector('b');
        bnum.textContent = k > 0 ? fa(Math.round(s.n * prog(t, at, at + 0.35, E.out5))) : '–';
        bnum.style.color = k > 0 ? 'var(--ink)' : '#cbbf9f';
      });
      // the check
      const cv = win(t, b(4.5) - 0.05, b(6) + 0.1, 0.25, 0.3);
      show($('#chk'), cv);
      if (cv > 0) {
        const ki = prog(t, b(4.5) - 0.05, b(4.5) + 0.3, E.out5);
        css($('#chk .kick'), { opacity: ki.toFixed(3), transform: `translateY(${((1 - ki) * 16).toFixed(1)}px)` });
        $$('#eq > *').forEach((el, i) => {
          const k = prog(t, b(4.5) + 0.05 + i * 0.07, b(4.5) + 0.4 + i * 0.07, E.out5);
          css(el, { opacity: k.toFixed(3), transform: `translateY(${((1 - k) * 30).toFixed(1)}px)`, filter: `blur(${((1 - k) * 8).toFixed(2)}px)` });
        });
        const rk = prog(t, b(4.75) + 0.2, b(5) + 0.1, E.out5);
        css($('#eqr'), { opacity: rk.toFixed(3), transform: `scale(${lerp(0.94, 1, rk).toFixed(4)})` });
        css($('#eqr .num'), { filter: `blur(${((1 - rk) * 12).toFixed(2)}px)` });
        const gk = prog(t, b(5) - 0.05, b(5) + 0.25, E.out5);
        css($('#gauge'), { opacity: gk.toFixed(3), transform: `translateY(${((1 - gk) * 24).toFixed(1)}px)` });
        // the needle sweeps from the far edge to the measured gap: half a percent inside a 25% band
        const nk = prog(t, b(5) + 0.05, b(5.5) - 0.16, E.back);
        const gx = 600 + (lerp(-0.25, D.check.gap, nk) / 0.25) * 600;
        css($('#gauge .needle'), { left: `${gx.toFixed(1)}px` });
        css($('#gauge .val'), { left: `${gx.toFixed(1)}px`, opacity: prog(t, b(5.5) - 0.1, b(5.5) + 0.1).toFixed(3) });
        // the stamp lands on the beat (its sound is there too)
        const st = prog(t, b(5.5) - 0.16, b(5.5), ease.in), settle = prog(t, b(5.5), b(5.5) + 0.24, E.out5);
        css($('#stamp'), { opacity: Math.min(1, st * 1.4).toFixed(3), transform: `rotate(-7deg) scale(${(t < b(5.5) ? lerp(1.9, 1, st) : lerp(0.94, 1, settle)).toFixed(4)})` });
        const out = prog(t, b(6) - 0.25, b(6) + 0.1, ease.in);
        css($('#chk'), { transform: `scale(${lerp(1, 0.92, out).toFixed(4)})`, filter: `blur(${(out * 10).toFixed(2)}px)` });
      }
    }
  }

  /* S6: the currency wall flips in, right to left; the euro is singled out and flies to the desk */
  {
    const v = win(t, b(6) - 0.12, b(7.25) + 0.36, 0.15, 0.3);
    show($('#wall'), v);
    if (v > 0) {
      cam($('#wallIn'), t, [{ t: b(6) - 0.12, x: 960, y: 486, s: 1.0, e: E.linear }, { t: b(7.5) + 0.2, x: 990, y: 470, s: 1.05 }]);
      const pick = prog(t, b(7) - 0.05, b(7) + 0.2, E.out5);
      const lift = prog(t, b(7.25), b(7.25) + 0.12, ease.linear) > 0 ? 1 : 0;
      TILES.forEach((T, i) => {
        const at = b(6) - 0.05 + T.col * 0.07 + T.row * 0.045;
        const k = prog(t, at, at + 0.36, E.out5);
        const dim = T === EUR ? 0 : pick;
        css(T.el, { opacity: (k * (1 - dim * 0.68) * (T === EUR && lift ? 0 : 1)).toFixed(3), transform: `perspective(1200px) rotateX(${((1 - k) * -82).toFixed(2)}deg)`, filter: dim > 0.02 ? `blur(${(dim * 2.4).toFixed(2)}px)` : 'none' });
        roll(T.cells, t, { t0: at, t1: b(6.5) + (T.col % 2 ? BEAT : 0) + T.row * 0.03, spread: 0.18, blur: false });
      });
      css(EUR.el, { 'box-shadow': pick > 0 ? `0 0 0 ${(pick * 6).toFixed(1)}px rgba(226, 184, 90, 0.9), 0 30px 60px -20px rgba(0,0,0,.6)` : '' });
    }
  }
  /* the euro tile in flight: from its place on the wall to the desk's rate field */
  {
    const t0 = b(7.25), t1 = b(7.75);
    const v = t >= t0 && t <= t1 + 0.18 ? 1 : 0;
    fly.style.visibility = v ? 'visible' : 'hidden';
    if (v) {
      // where the euro tile sits on screen at t0 (the wall's camera at that moment)
      const wk = clamp01((t0 - (b(6) - 0.12)) / (b(7.5) + 0.2 - (b(6) - 0.12)));
      const ws = lerp(1, 1.05, E.expoInOut(wk)), wx = lerp(960, 990, E.expoInOut(wk)), wy = lerp(486, 470, E.expoInOut(wk));
      const sx = 960 - wx * ws + EUR.x * ws, sy = 540 - wy * ws + EUR.y * ws, sw = TW * ws;
      // the rate field on the desk card at the moment it lands (the desk's camera at t1)
      const dc = deskCam(t1);
      const fx = dc.ox + (DK.x + RATE.x * KD) * dc.s, fy = dc.oy + (DK.y + RATE.y * KD) * dc.s, fw = RATE.w * KD * dc.s, fh = RATE.h * KD * dc.s;
      const k = prog(t, t0, t1, E.expoInOut);
      const arc = Math.sin(Math.PI * k) * -120;
      const se = fw / TW, ex = fx + fw / 2 - (TW * se) / 2, ey = fy + fh / 2 - (TH * se) / 2;
      const sc = lerp(ws, se, k), x = lerp(sx, ex, k), y = lerp(sy, ey, k) + arc;
      const vel = Math.sin(Math.PI * k);
      css(flyTile, { left: '0px', top: '0px', 'transform-origin': '0 0', transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${sc.toFixed(4)})`, opacity: (1 - prog(t, t1, t1 + 0.18)).toFixed(3),
        filter: vel > 0.1 ? `blur(${(vel * 2.5).toFixed(2)}px)` : 'none', 'box-shadow': `0 ${(30 + vel * 30).toFixed(0)}px ${(60 + vel * 40).toFixed(0)}px -20px rgba(0,0,0,.55), 0 0 0 5px rgba(226,184,90,.9)` });
    }
  }

  /* S7: the desk; the camera leans in to the rate the euro left there */
  {
    const v = win(t, b(7.5) - 0.12, b(9) + 0.1, 0.25, 0.3);
    show($('#desk'), v);
    if (v > 0) {
      const dc = deskCam(t);
      // a point (X, Y) of the frame goes to (ox + X·s, oy + Y·s); the card keeps its place and moves by the difference
      css($('#dk'), { 'transform-origin': '0 0', transform: `translate(${(dc.ox + DK.x * dc.s - DK.x).toFixed(2)}px, ${(dc.oy + DK.y * dc.s - DK.y).toFixed(2)}px) scale(${dc.s.toFixed(5)})` });
      const rk = prog(t, b(7.75) + 0.05, b(7.75) + 0.4, E.out5);
      css(rRate, { opacity: (rk * (1 - prog(t, b(9) - 0.3, b(9)))).toFixed(3), transform: `scale(${lerp(1.15, 1, rk).toFixed(4)})` });
      const nk = win(t, b(8) + 0.05, b(9) - 0.05, 0.35, 0.25);
      const fx = dc.ox + (DK.x + RATE.x * KD) * dc.s, fy = dc.oy + (DK.y + (RATE.y + RATE.h) * KD) * dc.s;
      css($('#eurNote'), { left: `${(fx - 40).toFixed(1)}px`, top: `${(fy + 40).toFixed(1)}px`, opacity: nk.toFixed(3), transform: `translateY(${((1 - prog(t, b(8) + 0.05, b(8) + 0.4, E.out5)) * 18).toFixed(1)}px)` });
      css($('#desk'), { filter: `blur(${(prog(t, b(9) - 0.25, b(9) + 0.1, ease.in) * 10).toFixed(2)}px)` });
    }
  }

  /* S8: the day's requests go round the dial */
  {
    const v = win(t, b(9) - 0.1, b(10.5) + 0.15, 0.25, 0.3);
    show($('#dial'), v);
    if (v > 0) {
      push($('#dial'), t, b(9) - 0.1, b(10.5) + 0.15, 1.06, 1100, 470);
      const sweep = prog(t, b(9) + 0.15, b(10) + 0.05, E.inOut);
      const toQuote = prog(t, b(10) + 0.12, b(10.25) + 0.2, E.inOut);
      const quoteMin = Number(D.source.tehran.slice(0, 2)) * 60 + Number(D.source.tehran.slice(3));
      const handMin = sweep < 1 ? sweep * 1440 : 1440 + (quoteMin - 1440) * toQuote;
      const [hx, hy] = pt(handMin, DC.r - 8);
      $('#hand').setAttribute('x2', hx.toFixed(1));
      $('#hand').setAttribute('y2', hy.toFixed(1));
      $('#handTip').setAttribute('cx', hx.toFixed(1));
      $('#handTip').setAttribute('cy', hy.toFixed(1));
      $$('#dialSvg .tk').forEach((l) => {
        const m = Number(l.dataset.m);
        const passed = handMin >= m || sweep >= 1;
        const k = passed ? prog(t, b(9) + 0.15 + (m / 1440) * (b(10) - b(9) - 0.1), b(9) + 0.25 + (m / 1440) * (b(10) - b(9) - 0.1), E.out5) : 0;
        l.style.opacity = (0.16 + 0.84 * (sweep >= 1 ? 1 : k)).toFixed(3);
      });
      const din = prog(t, b(9) - 0.1, b(9) + 0.3, E.out5);
      css($('#dialSvg'), { 'transform-origin': `${DC.x}px ${DC.y}px`, transform: `rotate(${((1 - din) * -12).toFixed(2)}deg) scale(${lerp(0.9, 1, din).toFixed(4)})`, opacity: din.toFixed(3) });
      css($('#dialC'), { opacity: prog(t, b(9) + 0.2, b(9) + 0.5).toFixed(3) });
      $('#dialC b').textContent = fa(Math.round(D.budget.daily * prog(t, b(9) + 0.2, b(9) + 0.9, E.out5)));
      FACTS.forEach((f, i) => {
        const at = b(9.25) + i * 2 * BEAT;
        const k = prog(t, at, at + 0.35, E.out5);
        css(f.el, { opacity: k.toFixed(3), transform: `translateX(${((1 - k) * 40).toFixed(1)}px)`, filter: `blur(${((1 - k) * 6).toFixed(2)}px)` });
      });
      css($('#dial'), { filter: `blur(${(prog(t, b(10.5) - 0.15, b(10.5) + 0.15, ease.in) * 10).toFixed(2)}px)` });
    }
  }

  /* S9: the analysis works again on the same prices */
  {
    const v = win(t, b(10.5) - 0.1, b(12) + 0.1, 0.25, 0.3);
    show($('#ana'), v);
    if (v > 0) {
      push($('#ana'), t, b(10.5) - 0.1, b(12) + 0.1, 1.06, 960, 500);
      const tk = prog(t, b(10.5) - 0.05, b(10.5) + 0.3, E.out5);
      css($('#tagA'), { opacity: tk.toFixed(3), transform: `translateY(${((1 - tk) * -20).toFixed(1)}px)` });
      const ak = prog(t, b(10.5), b(10.5) + 0.4, E.out5);
      css($('#anchor'), { opacity: ak.toFixed(3), transform: `translateX(${((1 - ak) * 40).toFixed(1)}px)` });
      // a pulse from the price to each card, then the card works out its number
      $$('#links .lk').forEach((p, i) => {
        const at = b(10.75) + i * BEAT * 2;
        const L = p.getTotalLength();
        p.style.strokeDasharray = `${L}`;
        p.style.strokeDashoffset = `${(L * (1 - prog(t, at - 0.2, at + 0.05, ease.inOut))).toFixed(1)}`;
        p.style.opacity = (1 - prog(t, b(12) - 0.3, b(12))).toFixed(3);
      });
      CARDS.forEach((c, i) => {
        const at = b(10.75) + i * BEAT * 2;
        const k = prog(t, at, at + 0.38, E.out5);
        css(c.el, { opacity: k.toFixed(3), transform: `translateX(${((1 - k) * -40).toFixed(1)}px) scale(${lerp(0.96, 1, k).toFixed(4)})`, filter: `blur(${((1 - k) * 6).toFixed(2)}px)` });
        roll(c.cells, t, { t0: at, t1: at + 0.55, spread: 0.22 });
      });
      // the مظنه, from the board, steps forward: the next scene prices a sentence with it
      const mk = prog(t, b(11.5), b(11.5) + 0.35, E.out5);
      const drop = prog(t, b(12) - 0.12, b(12) + 0.3, E.expoInOut);
      css($('#mz'), { opacity: mk.toFixed(3), transform: `translate(${(drop * -560).toFixed(1)}px, ${(drop * -170).toFixed(1)}px) scale(${lerp(1, 0.8, drop).toFixed(4)})` });
      css($('#ana'), { filter: `blur(${(prog(t, b(12) - 0.1, b(12) + 0.15, ease.in) * 6).toFixed(2)}px)` });
    }
  }

  /* S10–S11: the sentence, its parts, its price, its line */
  {
    const v = win(t, b(12) - 0.05, b(14.5) + 0.12, 0.25, 0.3);
    show($('#cmd'), v);
    if (v > 0) {
      const hand = prog(t, b(12) + 0.2, b(13) + 0.5, E.inOut);
      // while the sentence types, the bar and its parts sit in the middle of the frame (where the مظنه drops in); the
      // camera rises to the price and the line as they arrive
      const rise = prog(t, b(13.5) - 0.45, b(13.5) + 0.25, E.inOut);
      css($('#cmd'), { 'transform-origin': '960px 480px', transform: `translate(${lerp(70, -50, hand).toFixed(2)}px, ${lerp(150, 0, rise).toFixed(2)}px) scale(${lerp(1, 1.07, prog(t, b(12) - 0.05, b(14.5) + 0.12, ease.linear)).toFixed(5)})` });
      const bk = prog(t, b(12) - 0.05, b(12) + 0.3, E.out5);
      css($('#bar'), { opacity: bk.toFixed(3), transform: `translateY(${((1 - bk) * 30).toFixed(1)}px) scale(${lerp(0.97, 1, bk).toFixed(4)})` });
      // typing: word by word, on a steady hand
      const tw = $$('#bar .tw'), T0 = b(12) + 0.25, T1 = b(13) + 0.45;
      tw.forEach((w, i) => {
        const at = lerp(T0, T1, i / (tw.length - 1));
        const k = prog(t, at - 0.05, at + 0.08, ease.out);
        w.style.opacity = k.toFixed(3);
        w.style.display = t >= at - 0.05 ? 'inline-block' : 'none';
      });
      css($('#bar .caret'), { opacity: t < T1 + 0.4 ? ((Math.floor(t * 4) % 2 === 0) ? 1 : 0.15).toString() : '0' });
      // each part becomes a chip once its words are in
      const chips = $$('#chips .chip');
      PARTS.forEach((p, i) => {
        const at = lerp(T0, T1, PART_END[i] / (tw.length - 1)) + 0.08;
        const k = prog(t, at, at + 0.3, E.out5);
        css(chips[i], { opacity: k.toFixed(3), transform: `translateY(${((1 - k) * 22).toFixed(1)}px)`, filter: `blur(${((1 - k) * 6).toFixed(2)}px)` });
      });
      const pk = prog(t, b(13.5) - 0.05, b(13.5) + 0.35, E.out5);
      css($('#price'), { opacity: pk.toFixed(3), transform: `translateY(${((1 - pk) * 20).toFixed(1)}px)` });
      const nums = $$('#price .num');
      const rv = prog(t, b(13.5) + 0.2, b(13.5) + 0.5, E.out5);
      css(nums[1], { display: 'inline-block', opacity: rv.toFixed(3), filter: `blur(${((1 - rv) * 10).toFixed(2)}px)` });
      const lk = prog(t, b(14) - 0.05, b(14) + 0.3, E.out5);
      css($('#lineCard'), { opacity: lk.toFixed(3), transform: `translateY(${((1 - lk) * 30).toFixed(1)}px)` });
      const lv = prog(t, b(14) + 0.1, b(14) + 0.4, E.out5);
      css($('#lineCard b'), { opacity: lv.toFixed(3), filter: `blur(${((1 - lv) * 10).toFixed(2)}px)` });
      const ek = prog(t, b(14.25) - 0.1, b(14.25), ease.out), press = t >= b(14.25) && t < b(14.25) + 0.12 ? 1 : 0;
      css($('#enter'), { opacity: (ek * (1 - prog(t, b(14.5) - 0.1, b(14.5) + 0.1))).toFixed(3), transform: `translateY(${(press * 4).toFixed(1)}px)`, 'border-bottom-width': `${press ? 2 : 6}px` });
      css($('#cmd'), { filter: `blur(${(prog(t, b(14.5) - 0.1, b(14.5) + 0.2, ease.in) * 8).toFixed(2)}px)` });
    }
  }

  /* S12: booked: the receipt prints up; its tracking code is ringed */
  {
    const v = win(t, b(14.5) - 0.05, b(16) + 0.12, 0.2, 0.3);
    show($('#rc'), v);
    if (v > 0) {
      push($('#rc'), t, b(14.5) - 0.05, b(16) + 0.12, 1.06, 1100, 470);
      const feed = prog(t, b(14.5) - 0.05, b(14.5) + 0.55, E.out5);
      const drift = prog(t, b(14.5), b(16), ease.linear);
      css($('#rcShot'), { transform: `perspective(1600px) translateY(${((1 - feed) * 420 - drift * 18).toFixed(1)}px) rotateX(${((1 - feed) * 16).toFixed(2)}deg) rotateZ(${lerp(-1.2, 0.6, drift).toFixed(2)}deg)`, opacity: Math.min(1, feed * 2).toFixed(3) });
      const rk = prog(t, b(15) - 0.05, b(15) + 0.3, E.out5);
      css($('#rTrack'), { opacity: rk.toFixed(3), transform: `scale(${lerp(1.12, 1, rk).toFixed(4)})` });
      const h = $('#rcText h2'), l = $('#rcText .lab'), k = $('#rcText .trk'), a = $('#rcText .amt');
      const hk = prog(t, b(14.5) + 0.15, b(14.5) + 0.45, E.out5);
      css(h, { opacity: hk.toFixed(3), transform: `scale(${lerp(1.25, 1, hk).toFixed(4)})`, 'transform-origin': '100% 50%', filter: `blur(${((1 - hk) * 10).toFixed(2)}px)` });
      for (const [el, at] of [[l, b(15) - 0.1], [k, b(15)], [a, b(15.25)]]) {
        const q = prog(t, at, at + 0.35, E.out5);
        css(el, { opacity: q.toFixed(3), transform: `translateY(${((1 - q) * 20).toFixed(1)}px)` });
      }
      css($('#rc'), { filter: `blur(${(prog(t, b(16) - 0.1, b(16) + 0.12, ease.in) * 10).toFixed(2)}px)` });
    }
  }

  /* S13: the end card: the crown draws, the name, the line, where to get it; a glint on the track's own last hit */
  {
    const v = prog(t, b(16) - 0.08, b(16) + 0.2, E.out5);
    show($('#end'), v);
    if (v > 0) {
      const drift = prog(t, b(16), window.DUR, ease.linear);
      css($('#end'), { transform: `scale(${lerp(1, 1.045, drift).toFixed(4)})`, 'transform-origin': '50% 45%' });
      const ck = prog(t, b(16), b(16) + 0.9, E.inOut);
      crownPaths.forEach((p) => (p.style.strokeDashoffset = `${(Number(p.dataset.len) * (1 - ck)).toFixed(1)}`));
      css($('#crownBox'), { opacity: prog(t, b(16), b(16) + 0.2).toFixed(3) });
      const nk = prog(t, b(16) + 0.25, b(16) + 0.75, E.out5);
      css($('#endName'), { opacity: nk.toFixed(3), filter: `blur(${((1 - nk) * 14).toFixed(2)}px)`, transform: `translateY(${((1 - nk) * 16).toFixed(1)}px)` });
      for (const [sel, at] of [['#endTag', b(16) + 0.45], ['#endCta', b(16) + 0.7], ['#endUrl', b(16) + 0.85], ['#endFine', b(16) + 1.0]]) {
        const q = prog(t, at, at + 0.4, E.out5);
        css($(sel), { opacity: q.toFixed(3), transform: `translateY(${((1 - q) * 18).toFixed(1)}px)` });
      }
      // the glint: one soft band across the crown and the name on the track's own last hit
      const g = $('#glint'), gc = g.getContext('2d');
      gc.clearRect(0, 0, 1920, 1080);
      const gk = prog(t, b(18) - 0.05, b(18) + 0.9, E.inOut);
      if (gk > 0 && gk < 1) {
        const x = lerp(400, 1600, gk);
        const grd = gc.createLinearGradient(x - 220, 0, x + 220, 0);
        grd.addColorStop(0, 'rgba(255,240,200,0)');
        grd.addColorStop(0.5, 'rgba(255,236,190,0.55)');
        grd.addColorStop(1, 'rgba(255,240,200,0)');
        gc.fillStyle = grd;
        gc.fillRect(0, 100, 1920, 520);
      }
    }
  }

  /* the source of the prices, while prices are on screen; then the rail of lines */
  {
    const sv = Math.max(win(t, b(3) + 0.05, b(7.5) - 0.1, 0.3, 0.2), win(t, b(9) - 0.05, b(12) - 0.05, 0.3, 0.3));
    show($('#src'), sv);
    const onDark = dark > 0.5;
    css($('#src'), { color: onDark ? '#8f7b55' : '#6b6457' }); // 4.5:1 or more on the board and on the paper
  }
  for (const c of CAPS) words(c.el, t, { t0: c.t0, t1: c.t1, stagger: 0.06, din: 0.5, dout: 0.28, blur: 12, rise: 14 });
}

/** the desk's camera: the whole desk card, then a lean in toward the rate field (returns screen offset and scale) */
function deskCam(t) {
  const fcx = DK.x + (RATE.x + RATE.w / 2) * KD, fcy = DK.y + (RATE.y + RATE.h / 2) * KD;
  const k = prog(t, b(7.75) + 0.1, b(8.6), E.inOut), s = lerp(1, 1.42, k) * lerp(1, 1.02, prog(t, b(8.6), b(9), ease.linear));
  // keep the field's point moving from where it sits toward the centre-left of the frame
  const tx = lerp(fcx, 860, k), ty = lerp(fcy, 520, k);
  return { s, ox: tx - fcx * s, oy: ty - fcy * s };
}

/* ---------------- the sound cues (mix.mjs lays each on its frame) and the music edit ----------------
   Each cue's level was solved against the music alone, in the sound's own band: +3.5 dB, the whooshes +2.5, the chime
   +4, the sparkles +3, with the 2–8 kHz lift under 4 dB and its peak at most 6 dB over the music's (8 for the chime and
   the last sparkle), and never more than 6 dB over its band. Mozart's piano and forte are 20 dB apart, so every cue has
   its own level: a sound follows the score instead of keeping one loudness through it. */
// the tonal sounds are tuned into G minor (semitones): the chime's A to G, the sparkle's C to B♭, the pop's E to D,
// the click's G♯ (+25 cents) to G; the typing's E♭ is already in the key
const PITCH = { chime: -2, sparkle: -2, pop: -2, 'click-soft': -1.25 };
const cue = (t, s, v) => ({ t, s, v, ...(PITCH[s] ? { p: PITCH[s] } : {}) });
window.EV = [
  cue(2 * BEAT, 'click-soft', 0.25),
  cue(3 * BEAT, 'click-soft', 0.103),
  cue(b(1) - 0.06, 'whoosh-short', 0.403),
  cue(b(1) + 2 * BEAT, 'click-soft', 1.147),
  cue(b(2) - 0.12, 'whoosh-short', 0.053),
  cue(b(2) + 0.28, 'pop', 0.092),
  cue(b(3) - 0.25, 'whoosh', 0.439),
  cue(b(3.5) + 0.62, 'sparkle', 0.011),
  ...SECS.map((_, i) => cue(b(4) + i * BEAT * 0.5 - 0.1, 'pop', [0.127, 0.217, 0.208, 0.071][i])),
  cue(b(4.5) - 0.05, 'whoosh-short', 0.098),
  cue(b(5.5), 'pop', 0.788), // the stamp lands
  cue(b(6) - 0.12, 'whoosh-short', 0.078),
  cue(b(7), 'pop', 0.778),
  cue(b(7.25), 'whoosh', 0.315),
  cue(b(7.75) + 0.05, 'pop', 0.562),
  cue(b(9) - 0.1, 'whoosh-short', 0.266),
  cue(b(10.5) - 0.1, 'whoosh-short', 0.023),
  ...CARDS.map((_, i) => cue(b(10.75) + i * BEAT * 2, 'pop', [0.119, 0.752, 0.517][i])),
  cue(b(12) - 0.12, 'whoosh-short', 0.237),
  cue(b(12) + 0.25, 'typing', 2.358),
  cue(b(12.75) + 0.2, 'typing', 0.684),
  cue(b(14.25), 'click-soft', 0.283), // Enter
  cue(b(14.5) + 0.15, 'chime', 0.307),
  cue(b(16) - 0.08, 'whoosh-short', 0.42),
  cue(b(18), 'sparkle', 0.08), // the final chord
];
// the music is warp-music.py's track (live-music.json): laid whole from its start, the final chord fading at the end
window.MUSIC = { file: 'mozart-k550-iv (warp-music.py, live-music.json)', from: 0, bpm: BPM, dur: window.DUR, fade: 0.9 };

window.seek = (t) => frame(t);
await Promise.all([...[500, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px Estedad`, 'بئاتریس ۱۲۳ abc')), document.fonts.load('700 40px Markazi', 'بئاتریس'), document.fonts.load('800 40px Vazirmatn', '۱٬۲۳۴٫۵')]);
await document.fonts.ready;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
// each line holds long enough to read (letters ÷ 15 + 1.5 s), and fits the frame
for (const c of CAPS) {
  const text = c.el.textContent;
  if (c.t1 - c.t0 - 0.3 < readTime(text)) console.error(`line too short to read: «${text}» ${(c.t1 - c.t0 - 0.3).toFixed(2)} s < ${readTime(text).toFixed(2)} s`);
  if (c.el.offsetWidth > 1760) console.error(`line too wide: «${text}» ${c.el.offsetWidth}px`);
}
// every cue on the grid: the film's own events sit on a beat or are marked as following a picture event
frame(0);
window.READY = true;
</script>
