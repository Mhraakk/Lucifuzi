<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<!-- Tutorial chapter cards (1280×720), the same visual language as the «منشور» teaser: a beam enters the gem and
     opens into a spectrum, the chapter lands; the end card names the next chapter. seek(t) is pure.
     ?kind=open|end&n=18&title=…&sub=…&next=… -->
<style>
@font-face { font-family: 'Estedad'; src: url('/public/fonts/estedad-arabic-var.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Estedad'; src: url('/public/fonts/estedad-latin-var.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #07080a; font-family: Estedad, sans-serif; color: #f2ede2; }
canvas { position: absolute; inset: 0; }
.t { position: absolute; right: 96px; left: 420px; white-space: normal; }
#kick { top: 196px; font-size: 26px; font-weight: 700; color: #e2bd6e; }
#title { top: 238px; font-size: 54px; font-weight: 800; line-height: 1.35; }
#sub { top: 410px; font-size: 25px; font-weight: 500; color: #c9c1b0; line-height: 1.7; }
#brand { position: absolute; left: 40px; bottom: 26px; font-size: 16px; color: rgba(242,237,226,.4); }
.gold { background: linear-gradient(100deg, #fff1c9 0%, #e2bd6e 45%, #a27c3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="t" id="kick"></div><div class="t" id="title"></div><div class="t" id="sub"></div>
<div id="brand">بئاتریس · راهنمای تصویری</div>
<script>
const q = new URLSearchParams(location.search);
const KIND = q.get('kind') ?? 'open';
const fa = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const DUR = KIND === 'open' ? 5 : 3.6;
const SPEC = ['#ff4d4d', '#ff9a3c', '#ffd84a', '#6fe07a', '#46c8ff', '#6f7dff', '#c06bff'];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const inCubic = (x) => x * x * x;
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const g = $('cv').getContext('2d');
const GEM = { x: 230, y: 330, r: 82 };

if (KIND === 'open') {
  $('kick').textContent = `فصل ${fa(q.get('n') ?? '')}`;
  $('title').textContent = q.get('title') ?? '';
  $('sub').textContent = q.get('sub') ?? '';
} else {
  $('kick').textContent = `پایان فصل ${fa(q.get('n') ?? '')}`;
  $('title').textContent = q.get('next') ? `فصل بعد: ${q.get('next')}` : 'پایان راهنما';
  $('sub').textContent = q.get('next') ? 'از فهرست راهنما، یا همین حالا ادامه دهید.' : 'همه فصل‌ها در «راهنمای تصویری» هستند.';
}
$('title').classList.toggle('gold', KIND === 'end');

function gem(cx, cy, r, a, draw) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const gr = g.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  gr.addColorStop(0, '#fff1c9'); gr.addColorStop(0.5, '#e2bd6e'); gr.addColorStop(1, '#a27c3a');
  g.strokeStyle = gr; g.lineJoin = 'round';
  const P = (k) => Array.from({ length: 8 }, (_, j) => { const an = -Math.PI / 2 + (j * Math.PI) / 4; return [cx + Math.cos(an) * r * k, cy + Math.sin(an) * r * k]; });
  const o = P(1), i = P(0.47);
  const poly = (pts, w, p) => { g.lineWidth = w; g.beginPath(); const n = Math.max(1, Math.ceil(8 * p)); for (let j = 0; j <= n; j++) { const v = pts[j % 8]; j ? g.lineTo(v[0], v[1]) : g.moveTo(v[0], v[1]); } g.stroke(); };
  g.fillStyle = 'rgba(226,189,110,0.06)'; g.beginPath(); o.forEach((v, j) => (j ? g.lineTo(...v) : g.moveTo(...v))); g.closePath(); g.fill();
  poly(o, 4, clamp(draw * 1.4)); poly(i, 2.5, clamp(draw * 1.4 - 0.3));
  g.lineWidth = 1.4; g.globalAlpha = a * clamp(draw * 2 - 1); g.beginPath();
  for (let j = 0; j < 8; j++) { g.moveTo(...o[j]); g.lineTo(...i[j]); g.moveTo(...o[j]); g.lineTo(...i[(j + 1) % 8]); }
  g.stroke(); g.restore();
}

window.DUR = DUR;
window.seek = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = '#07080a'; g.fillRect(0, 0, 1280, 720);
  const hz = g.createRadialGradient(900, 160, 0, 900, 160, 800); hz.addColorStop(0, 'rgba(60,46,24,0.5)'); hz.addColorStop(1, 'rgba(7,8,10,0)');
  g.fillStyle = hz; g.fillRect(0, 0, 1280, 720);
  const outT = KIND === 'open' ? prog(t, 4.3, 5.0) : 0;
  gem(GEM.x, GEM.y, GEM.r, outExpo(prog(t, 0, 0.8)) * (1 - outT), outExpo(prog(t, 0, 1.0)));
  // the beam in, the spectrum out (under the title, fading as the words settle)
  g.save(); g.globalCompositeOperation = 'lighter';
  const beam = inOut(prog(t, 0.1, 0.9));
  g.globalAlpha = (1 - prog(t, 2.4, 3.4)) * 0.95; g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-20, GEM.y + 26); g.lineTo(lerp(-20, GEM.x - GEM.r * 0.7, beam), GEM.y); g.stroke();
  const grow = outExpo(prog(t, 0.85, 2.0));
  for (let k = 0; k < 7; k++) {
    const ang = ((k - 3) * 2.6 * Math.PI) / 180 + 0.14, len = 1150 * grow;
    g.strokeStyle = SPEC[k]; g.lineWidth = 2.4; g.globalAlpha = lerp(0.8, 0.22, prog(t, 1.6, 2.8)) * (1 - outT);
    g.beginPath(); g.moveTo(GEM.x + GEM.r * 0.75, GEM.y); g.lineTo(GEM.x + GEM.r * 0.75 + Math.cos(ang) * len, GEM.y + Math.sin(ang) * len); g.stroke();
  }
  // the flash
  if (t > 0.85) { const f = 1 - prog(t, 0.85, 1.8), r = 260 * outExpo(prog(t, 0.85, 1.6)); const gr = g.createRadialGradient(GEM.x, GEM.y, 0, GEM.x, GEM.y, r + 1); gr.addColorStop(0, `rgba(255,240,200,${0.6 * f})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(0, 0, 1280, 720); }
  // the exit: seven skewed bands sweep across (open card only)
  if (outT > 0) {
    const x = lerp(1500, -500, inOut(outT));
    for (let k = 0; k < 7; k++) { g.globalAlpha = 0.6; g.fillStyle = SPEC[k]; const bx = x + k * 30; g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx + 26, 0); g.lineTo(bx - 130 + 26, 720); g.lineTo(bx - 130, 720); g.closePath(); g.fill(); }
  }
  g.restore();
  const a = outExpo(prog(t, 1.0, 1.6)), b = outExpo(prog(t, 1.25, 1.9)), c = outExpo(prog(t, 1.6, 2.3)), x = inCubic(outT);
  const css = (el, v, dy) => Object.assign(el.style, { opacity: v * (1 - x), transform: `translateY(${lerp(dy, 0, v) - x * 20}px)`, filter: `blur(${(1 - v) * 8 + x * 6}px)` });
  css($('kick'), a, 18); css($('title'), b, 26); css($('sub'), c, 18);
  $('brand').style.opacity = String(a * 0.9 * (1 - x));
};
document.fonts.ready.then(() => { window.READY = true; window.seek(0); });
</script>
</body></html>
