name: platform-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Platform double-test
        run: npm run test:double
      - name: Release gates (eval)
        run: npx tsx scripts/release-gates.ts
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
