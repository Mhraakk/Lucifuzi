<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="40%" stop-color="#e0b84d"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#f5e6b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f5e6b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="450" cy="420" r="260" fill="url(#spot)"/>
  
  <g filter="url(#soft)" transform="translate(450 400)">
    <ellipse cx="0" cy="130" rx="105" ry="22" fill="#000" opacity="0.35"/>
    <circle cx="0" cy="15" r="100" fill="url(#gold)"/>
    <circle cx="0" cy="15" r="78" fill="none" stroke="#5a4010" stroke-width="6" stroke-dasharray="8 6" opacity="0.45"/>
    <text x="0" y="28" text-anchor="middle" fill="#3a2808" font-family="Georgia" font-size="28">۲۱</text>
    <circle cx="0" cy="-95" r="8" fill="url(#gold)"/>
  </g>
  <text x="450" y="900" text-anchor="middle" fill="#f7f1e6" font-family="Georgia, serif" font-size="34">پلاک زردیس سکه‌ای</text>
  <text x="450" y="945" text-anchor="middle" fill="#b89a5c" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="5">ZARDIS · 21K</text>
</svg>