<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1c1814"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="40%" stop-color="#e0b84d"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#f5e6b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f5e6b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="450" cy="420" r="260" fill="url(#spot)"/>
  
  <g filter="url(#soft)" transform="translate(450 400)">
    <ellipse cx="0" cy="130" rx="150" ry="28" fill="#000" opacity="0.35"/>
    <path d="M-90,40 Q0,-80 90,40" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="-70" cy="55" r="14" fill="url(#gold)"/>
    <circle cx="70" cy="55" r="14" fill="url(#gold)"/>
    <rect x="-40" y="70" width="80" height="18" rx="9" fill="url(#gold)"/>
  </g>
  <text x="450" y="900" text-anchor="middle" fill="#f7f1e6" font-family="Georgia, serif" font-size="34">سرویس عروس</text>
  <text x="450" y="945" text-anchor="middle" fill="#b89a5c" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="5">ARYA SET</text>
</svg>